<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0618">
<meta name="description" content="Hábitos espirituais e de estudo, diário de sonhos e do dia com memória, e estante de livros.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chronos 84">
<title>Chronos 84</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Chakra+Petch:wght@400;500;600;700&family=VT323&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="sky" aria-hidden="true"><div class="sun"></div><div class="grid"></div></div>
<div class="scan" aria-hidden="true"></div>

<div id="app">
  <main id="view"></main>
  <nav class="tabs" aria-label="Navegação">
    <button class="tab" data-tab="hoje"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z"/></svg>Hoje</button>
    <button class="tab" data-tab="diario"><svg viewBox="0 0 24 24"><path d="M5 3h12l2 2v16H5z M9 8h6 M9 12h6 M9 16h4"/></svg>Diário</button>
    <button class="fab" data-act="quick" aria-label="Novo registro"><span>+</span></button>
    <button class="tab" data-tab="memoria"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="9"/></svg>Memória</button>
    <button class="tab" data-tab="livros"><svg viewBox="0 0 24 24"><path d="M4 4h5v16H4z M10 4h5v16h-5z M16 5l4 1-3 14-4-1z"/></svg>Livros</button>
  </nav>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-card" id="sheetCard" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="app.js"></script>
</body>
</html>
